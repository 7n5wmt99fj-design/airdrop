<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEXSCREENR | Terminal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
  
  body {
    background-color: #050505;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  .app-container {
    width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column;
    background: #0a0a0c; /* Leicht helleres Schwarz für App-Feeling */
  }

  /* TOP HEADER */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05);
    background: #0a0a0c; z-index: 10;
  }
  
  .brand { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-weight: 800; color: #14F195; font-size: 14px; }
  .pulse-dot { width: 6px; height: 6px; background: #14F195; border-radius: 50%; animation: pulse 1s infinite alternate; }
  @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; box-shadow: 0 0 8px #14F195; } }

  .header-actions { display: flex; align-items: center; gap: 12px; color: #a1a1aa; }
  .header-actions svg { width: 20px; height: 20px; cursor: pointer; }
  
  .profile-pic {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
    object-fit: cover; cursor: pointer;
  }

  /* TERMINAL FEED */
  .feed-container {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
    scrollbar-width: none;
  }
  .feed-container::-webkit-scrollbar { display: none; }

  .callout {
    display: flex; flex-direction: column; gap: 4px;
    animation: slideIn 0.3s ease-out;
    font-family: 'JetBrains Mono', monospace;
  }

  @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

  .callout-header { font-size: 12px; color: #71717a; display: flex; align-items: center; gap: 6px; }
  .callout-header .tag { color: #3f3f46; font-size: 10px; }
  
  .callout-name { font-size: 18px; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .callout-entry { font-size: 14px; font-weight: 700; color: #14F195; text-shadow: 0 0 10px rgba(20, 241, 149, 0.2); }
  .callout-ath { font-size: 12px; color: #a1a1aa; margin-top: 2px; }
  .callout-ath span { color: #ffffff; font-weight: 700; }

  .divider { height: 1px; background: rgba(255,255,255,0.04); margin: 4px 0; }

  /* BOTTOM NAVIGATION */
  .bottom-nav {
    display: flex; justify-content: space-around; align-items: center;
    padding: 16px 0 24px 0; background: #0a0a0c; border-top: 1px solid rgba(255,255,255,0.05);
    z-index: 10;
  }

  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: #52525b; cursor: pointer; transition: color 0.2s;
  }
  .nav-item.active { color: #14F195; }
  .nav-item svg { width: 22px; height: 22px; }
  .nav-item span { font-size: 10px; font-weight: 600; }
</style>
</head>
<body>

  <div class="app-container">
    
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="brand">
        <div class="pulse-dot"></div>
        DEXSCREENR
      </div>
      <div class="header-actions">
        <!-- Settings Icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <!-- Profile Pic -->
        <img class="profile-pic" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Profile">
      </div>
    </div>

    <!-- FEED -->
    <div class="feed-container" id="feed">
      
      <div class="callout">
        <div class="callout-header"><span>@degen_caller</span> <span class="tag">2m ago</span></div>
        <div class="callout-name">$WIF</div>
        <div class="callout-entry">Called @ $12k</div>
        <div class="callout-ath">ATH: <span>$2.6M</span></div>
      </div>
      <div class="divider"></div>

      <div class="callout">
        <div class="callout-header"><span>@whale_alert</span> <span class="tag">15m ago</span></div>
        <div class="callout-name">$BONK</div>
        <div class="callout-entry">Called @ $500k</div>
        <div class="callout-ath">ATH: <span>$45M</span></div>
      </div>
      <div class="divider"></div>

      <div class="callout">
        <div class="callout-header"><span>@solana_sniper</span> <span class="tag">1h ago</span></div>
        <div class="callout-name">$POPCAT</div>
        <div class="callout-entry">Called @ $800k</div>
        <div class="callout-ath">ATH: <span>$15M</span></div>
      </div>
      <div class="divider"></div>

    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
      <div class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>Calls</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Dashboard</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        <span>Telegram</span>
      </div>
    </div>

  </div>

<script>
  const coins = [
    { name: "$WIF", caller: "@degen_caller", entry: "$12k", ath: "$2.6M" },
    { name: "$BONK", caller: "@whale_alert", entry: "$500k", ath: "$45M" },
    { name: "$POPCAT", caller: "@solana_sniper", entry: "$800k", ath: "$15M" },
    { name: "$MEW", caller: "@degen_caller", entry: "$1.2M", ath: "$8.5M" },
    { name: "$BOME", caller: "@alpha_hunter", entry: "$2.1M", ath: "$14M" },
    { name: "$SLERF", caller: "@solana_sniper", entry: "$400k", ath: "$3.2M" }
  ];

  const feed = document.getElementById('feed');

  function addCallout() {
    const coin = coins[Math.floor(Math.random() * coins.length)];
    const time = Math.floor(Math.random() * 10) + 1;
    
    const el = document.createElement('div');
    el.className = 'callout';
    el.innerHTML = `
      <div class="callout-header"><span>${coin.caller}</span> <span class="tag">${time}m ago</span></div>
      <div class="callout-name">${coin.name}</div>
      <div class="callout-entry">Called @ ${coin.entry}</div>
      <div class="callout-ath">ATH: <span>${coin.ath}</span></div>
    `;
    
    feed.prepend(el);
    
    const divider = document.createElement('div');
    divider.className = 'divider';
    feed.insertBefore(divider, el.nextSibling);

    if (feed.children.length > 15) {
      feed.lastChild.remove();
      feed.lastChild.remove();
    }
  }

  setInterval(addCallout, 8000);
</script>
</body>
</html>
